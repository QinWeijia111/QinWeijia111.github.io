name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format/check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - name: Lighthouse budget
        run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-lighthouse-reports
          include-hidden-files: true
          path: |
            playwright-report/
            .lighthouseci/reports/
